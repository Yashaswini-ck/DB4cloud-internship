<!DOCTYPE html>
<html>
<head>
<title>Student Profile Card</title>

<style>
        .card{
            width: 300px;
            border: 2px solid black;
            padding: 20px;
            background-color: lightblue;
            border-radius: 10px;
            margin: 50px auto;
            font-family: Arial;
        }

        span{
            font-weight: bold;
            color: darkblue;
        }
 
       
</style>
</head>

<body>

<div class="card">
<h2>Student Profile Card</h2>
 
<p><span>Name:</span> Yash</p>

<p><span>Age:</span> 18</p>

<p><span>Course:</span> Full Stack Development</p>
</div>
 


</body>
</html>
